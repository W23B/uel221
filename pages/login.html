<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les zones de pêche - Se connecter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/custom_L221.css" />
  </head>

  <body>
    <header>
      <a href="../index.html"><span>Les zones de pêche</span></a>

      <nav>
        <ul>
          <li><a href="login.html">Se connecter</a></li>
          <li><a href="about.html">À propos</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <a href="../index.html"><h1>Les zones de pêche</h1></a>

      <h2>Se connecter</h2>

      <form class="form-login" action="admin.html" method="get">
        <label for="identifiant">Votre identifiant :</label>
        <input
          type="text"
          name="identifiant"
          id="identifiant"
          placeholder="Votre identifiant..."
          required
        />

        <label for="password">Votre mot de passe :</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Votre mot de passe"
          required
        />

        <div class="checkboxLabel">
          <input type="checkbox" name="stayConnected" id="stayConnected" />
          <label for="stayConnected">Rester connecté</label>
        </div>

        <input class="btn-submit" type="submit" value="Se connecter" />
      </form>
    </main>

    <footer>
      <a href="../index.html"><span>Les zones de pêche</span></a>
      <nav>
        <ul>
          <li><a href="login.html">Se connecter</a></li>
          <li><a href="about.html">À propos</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
